<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 200" width="820" height="200">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#8be9fd"/>
      <stop offset="40%"  stop-color="#ff79c6"/>
      <stop offset="75%"  stop-color="#bd93f9"/>
      <stop offset="100%" stop-color="#50fa7b"/>
    </linearGradient>
    <linearGradient id="sub" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#6272a4"/>
      <stop offset="100%" stop-color="#44475a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="820" height="200" rx="14" fill="#0a0a0f"/>

  <!-- Cursor blink decoration -->
  <rect x="28" y="22" width="10" height="18" rx="2" fill="#00ffaa" opacity="0.85"/>

  <!-- Top bar dots -->
  <circle cx="58" cy="31" r="6" fill="#ff5555" opacity="0.7"/>
  <circle cx="78" cy="31" r="6" fill="#f1fa8c" opacity="0.7"/>
  <circle cx="98" cy="31" r="6" fill="#50fa7b" opacity="0.7"/>

  <!-- Divider under top bar -->
  <line x1="20" y1="52" x2="800" y2="52" stroke="#1a1a2e" stroke-width="1.5"/>

  <!-- Main logo text -->
  <text
    x="410"
    y="118"
    font-family="'Courier New', 'Lucida Console', monospace"
    font-size="62"
    font-weight="bold"
    fill="url(#grad)"
    text-anchor="middle"
    letter-spacing="-1"
  >Terminal Tutor</text>

  <!-- Subtitle -->
  <text
    x="410"
    y="155"
    font-family="'Courier New', 'Lucida Console', monospace"
    font-size="15"
    fill="url(#sub)"
    text-anchor="middle"
    letter-spacing="3"
  >STORY-DRIVEN CLI TRAINING  ✦  LEARN BY DOING</text>

  <!-- Bottom link -->
  <text
    x="410"
    y="182"
    font-family="'Courier New', 'Lucida Console', monospace"
    font-size="12"
    fill="#44475a"
    text-anchor="middle"
  >terminal-tutor.vercel.app</text>
</svg>
